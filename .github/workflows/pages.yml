name: Pages — Echobloom Atlas original puzzle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every original puzzle and browser safety invariants
        run: node --test tests/puzzle.test.mjs
      - name: Build isolated static distribution with no QA artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp -- index.html style.css main.mjs puzzle.mjs favicon.svg site/
          test "$(find site -maxdepth 1 -type f | wc -l)" -eq 5
          ! grep -Eq 'https?://' site/index.html site/style.css site/main.mjs site/puzzle.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
